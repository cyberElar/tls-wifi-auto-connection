name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build and smoke test the release
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            python build_windows_release.py --version $releaseVersion
          } else {
            python build_windows_release.py
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CampusLogin-windows-x64
          path: |
            dist/CampusLogin-v*-windows-x64.zip
            dist/CampusLogin-v*-windows-x64.zip.sha256
          if-no-files-found: error
